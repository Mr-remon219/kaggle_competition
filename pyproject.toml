[project]
name = "kaggle-competition"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mr-remon219", email = "2609741281@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.3",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
]

[project.scripts]
space_train = "kaggle_competition.spaceship_titanic.train:train"
space_test = "kaggle_competition.spaceship_titanic.test:test"


[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cuda126" }
torchvision = { index = "pytorch-cuda126" }

[[tool.uv.index]]
name = "pytorch-cuda126"
url = "https://download.pytorch.org/whl/cu126"

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]
